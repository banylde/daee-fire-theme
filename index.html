<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>四王盗火</title>
<meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="四王盗火">
<style>
/* unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 — 大鹅基金看板家族样式 */
:root{--bg:#121213;--card:#18181a;--raised:#212124;--line:rgba(237,237,237,.08);--fg:#ededed;--sec:#a1a1a6;--mute:#85858b;--up:#e5484d;--dn:#3fb37f;
--serif:"Noto Serif CJK SC","Songti SC","STSong",serif;--sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:1440px;margin:0 auto;padding:32px 32px calc(32px + env(safe-area-inset-bottom))}
header.mast{display:flex;align-items:flex-start;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.seal{flex:none;width:44px;height:44px;border-radius:6px;background:var(--acc);color:#121213;font:500 26px/44px var(--serif);text-align:center}
.brand{font-size:13px;color:var(--sec);line-height:20px}
h1{font:500 28px/1.2 var(--serif);margin:0 0 4px;letter-spacing:.02em}
h2{font-size:15px;font-weight:500;margin:0 0 12px;line-height:22px}
.mute{color:var(--mute);font-size:12px;line-height:18px}
#meta{font-family:var(--mono),var(--sans);font-size:12px;color:var(--mute);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin:0 0 16px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;height:36px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{position:sticky;top:0;background:var(--raised);cursor:pointer;user-select:none;font-weight:400;font-size:12px;color:var(--mute);transition:color .15s var(--ease)}
th:hover,th.s{color:var(--fg)}
td{font-family:var(--mono),var(--sans);font-size:13px}
td.l,th.l{text-align:left;font-family:var(--sans)}
.p{color:var(--up)}.n{color:var(--dn)}
.yes{color:var(--sec)}.no{color:var(--mute)}
.tag{font:12px/18px var(--sans);padding:0 6px;border-radius:4px;margin-left:8px;color:var(--sec);border:1px solid var(--line);background:var(--raised)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
footer{margin:32px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;text-align:left}
footer .first{color:var(--sec)}
@media(max-width:640px){.page{padding:16px 16px calc(24px + env(safe-area-inset-bottom))}h1{font-size:24px}.seal{width:40px;height:40px;font-size:22px;line-height:40px}header.mast{gap:12px;padding-bottom:16px;margin-bottom:16px}.card{padding:16px}th,td{padding:8px 10px}}
:root{--acc:#f0a36a;--acc-ink:#f2c39a}
.tagline{font-size:13px;color:var(--sec);margin-top:4px}
.warnbar{border-left:2px solid var(--acc);color:var(--sec);font-size:13px;padding:12px 16px;border-radius:8px}.warnbar b{color:var(--fg);font-weight:500}
.fillnote{margin:8px 0 0;color:var(--sec);font-size:13px;line-height:20px}
.stalebar{background:#3a1618;border:1px solid var(--up);color:var(--fg);font-size:15px;line-height:22px;padding:14px 16px;border-radius:8px;margin:0 0 16px}
.stalebar b{color:var(--up);font-weight:500;margin-right:6px}
#histcard .wrap{margin:12px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips span{font-size:13px;line-height:20px;padding:6px 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.chips b{font-weight:500;margin-right:6px}
.st-atk{color:var(--up)}.st-ebb{color:var(--dn)}.st-wait{color:var(--acc-ink)}.st-stop{color:var(--up)}
table.min{min-width:720px}
td.wrap,th.wrap{white-space:normal;text-align:left;font-family:var(--sans);line-height:20px;height:auto}
#rule{font-size:13px;line-height:22px;color:var(--sec)}#rule b{font-weight:500;color:var(--fg)}
#rule p{margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 0;font-size:12px;color:var(--sec)}
.legend i{display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}
.chipbtn{font:inherit;color:var(--sec);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.chipbtn.on{color:var(--fg);border-color:var(--acc)}
#screener{margin:0 0 12px}
#paper .wrap,#extra .wrap{margin:12px 0 0}
details.navday{margin-top:12px}details.navday summary{cursor:pointer;color:var(--sec)}
</style></head><body>
<div class="page">
<header class="mast"><div class="seal" aria-hidden="true">火</div><div>
<div class="brand">大鹅基金 · 火部题材短线看板</div>
<h1>四王盗火</h1>
<div class="tagline">火部 · 题材短线</div>
<p class="fillnote">模拟盘：信号在信号日收盘后计算，按下一交易日开盘价成交（T+1 open）。涨停买不进，跌停卖不出。模拟盘现已遵循 A 股 T+1：买入当日股份不可卖，下一交易日才可卖。虚拟资金 100 万，不下单。</p>
<div id="meta">加载中…</div></div></header>
<div id="stale" hidden></div>
<div class="card warnbar" id="warn"></div>
<div class="card" id="sent"></div>
<div class="wrap"><table class="min" id="themes"><thead><tr></tr></thead><tbody></tbody></table></div>
<div id="screener"></div>
<div class="wrap"><table class="min" id="pool"><thead><tr></tr></thead><tbody></tbody></table></div>
<div id="extra"></div>
<div class="card" id="kings"></div>
<div class="card" id="histcard"><h2>调仓记录</h2><div class="mute" id="histnote"></div><div class="wrap"><table class="min" id="hist"><thead><tr></tr></thead><tbody></tbody></table></div></div>
<div class="card" id="paper"></div>
<div class="card" id="rule"></div>
<footer><span class="first">短线是负和游戏。仅供研究，不构成推荐。实盘前请核对最新交易规则。</span><br>模拟盘是虚拟资金，不连接券商。仓库内没有账户、密钥或真实持仓。</footer>
</div>
<script>
const ST={pass:'<span class="yes">通过</span>',fail:'<span class="no">未过</span>',manual:'<span class="st-wait">待人工确认</span>',missing:'<span class="no">缺数据</span>'};
const mark=c=>ST[c.state]||"缺数据";
const tip=(c)=>`${mark(c)} ${c.text||""}`;
function chip(k,v){return `<span><b>${k}</b>${v}</span>`}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yuan=n=>n==null||n===""?"数据缺失":Number(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const yi=n=>{if(n==null||n==="")return "数据缺失";const v=Number(n)/1e8;return (v>0?"+":"")+v.toFixed(2)+"亿"};
const ratioPct=x=>{if(x==null||x==="")return "数据缺失";const n=Number(x)*100;return (n>0?"+":"")+n.toFixed(2)+"%"};
function flowCell(t){
  const f=t.concept_flow;
  if(!f) return "—";
  if(f.status==="数据缺失") return '<span class="no">数据缺失</span>';
  if(f.status!=="ok") return `<span class="no">${esc(f.text||f.status||"未匹配")}</span>`;
  const n=Number(f.main_net),cls=n>0?"p":n<0?"n":"";
  return `<span class="${cls}">${esc(f.text||"")}</span>`;
}
let POOL=[],TAG="全部",RULES=[];
function tagText(r){
  if(r.strategy_status==="数据缺失") return '<span class="no">数据缺失</span>';
  if(!(r.strategy_tags||[]).length) return '<span class="no">无</span>';
  return `<span class="st-wait">${esc(r.strategy_tags.join("、"))}</span>`;
}
function drawPool(){
  const names=["全部"].concat(RULES.map(r=>r.name));
  document.getElementById("screener").innerHTML=`<div class="chips" role="group" aria-label="策略标签初筛">${names.map(name=>{
    const n=name==="全部"?POOL.length:POOL.filter(r=>(r.strategy_tags||[]).includes(name)).length;
    return `<button type="button" class="chipbtn${TAG===name?" on":""}" data-tag="${esc(name)}">${esc(name)} ${n}</button>`;
  }).join("")}</div><p class="mute">策略标签只筛这张表的展示，不改变股票池和四王。接口失败的标「数据缺失」，股票仍留在表里。</p>`;
  const rows=TAG==="全部"?POOL:POOL.filter(r=>(r.strategy_tags||[]).includes(TAG));
  document.querySelector("#pool tbody").innerHTML=rows.map(r=>`<tr>
<td class="l">${esc(r.code)}</td><td class="l">${esc(r.name)}</td><td class="l">${esc(r.theme)}</td><td class="l">${esc(r.role)}</td>
<td>${r.lbc}</td><td>${r.float_yi==null?"缺数据":r.float_yi}</td><td class="l">${esc(r.status)}</td>
<td class="wrap">${esc(r.limitup_reason||"—")}</td>
<td class="wrap">${tagText(r)}</td>
<td class="wrap">${esc(r.lhb_text||"—")}</td>
<td class="wrap">早 ${esc(r.chip_open_text||"—")}<br>尾 ${esc(r.chip_end_text||"—")}</td>
<td class="wrap">${esc((r.blocks||[]).join("；")||"—")}</td></tr>`).join("")||`<tr><td class="l" colspan="12">${TAG==="全部"?"股票池为空":"没有股票命中该标签"}</td></tr>`;
}
function miniTable(headers, rows){
  if(!rows.length) return `<p class="mute">当日无记录</p>`;
  return `<div class="wrap"><table class="min"><thead><tr>${headers.map(h=>`<th class="l wrap">${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function renderExtra(d){
  const lhb=d.lhb||{status:"数据缺失",rows:[]};
  const open=d.chip_open||{status:"数据缺失",rows:[]};
  const end=d.chip_end||{status:"数据缺失",rows:[]};
  const flow=d.concept_flow||{status:"数据缺失",top:[]};
  const lhbRows=(lhb.rows||[]).slice(0,20).map(r=>`<tr><td class="l">${esc(r.code)}</td><td class="l">${esc(r.name)}</td><td class="${(r.net||0)>0?"p":"n"}">${yi(r.net)}</td><td class="wrap">${esc(r.reason||"")}</td></tr>`);
  const chipRows=(rows)=>rows.slice(0,12).map(r=>`<tr><td class="l">${esc(r.code)}</td><td class="l">${esc(r.name)}</td><td>${r.bid_rate==null?"—":(r.bid_rate>0?"+":"")+Number(r.bid_rate).toFixed(2)+"%" }</td><td>${r.bid_ratio==null?"—":Number(r.bid_ratio).toFixed(1)+"%"}</td><td>${yi(r.bid_trust)}</td></tr>`);
  const top=(flow.top||[]).map(r=>`<tr><td class="l">${esc(r.name)}</td><td class="${(r.pct||0)>=0?"p":"n"}">${r.pct==null?"—":(r.pct>0?"+":"")+Number(r.pct).toFixed(2)+"%"}</td><td class="${(r.main_net||0)>=0?"p":"n"}">${yi(r.main_net)}</td><td class="l">${esc(r.top_name||"")}</td></tr>`);
  const block=(title,status,body)=>`<div class="card"><h2>${title}${status==="数据缺失"?' <span class="tag">数据缺失</span>':""}</h2>${status==="数据缺失"?"<p>数据缺失。构建没有中断，股票池没有因此删行。</p>":body}</div>`;
  document.getElementById("extra").innerHTML=
    block("龙虎榜",lhb.status,`<p class="mute">${esc(lhb.date||d.data_date||"")} · ${lhb.count??0} 只。同一只多条原因已合并，净买额取绝对值较大的一条。表内最多 20 条。</p>`+miniTable(["代码","名称","净买额","上榜原因"],lhbRows))+
    `<div class="grid2">`+
    block("早盘抢筹",open.status,`<p class="mute">通达信竞价公开接口，按抢筹委托金额前 100 名。未上榜不等于数据缺失。</p>`+miniTable(["代码","名称","抢筹幅度","抢筹占比","委托金额"],chipRows(open.rows||[])))+
    block("尾盘抢筹",end.status,`<p class="mute">${esc(end.date||d.data_date||"")} · ${end.count??0} 名。</p>`+miniTable(["代码","名称","抢筹幅度","抢筹占比","委托金额"],chipRows(end.rows||[])))+
    `</div>`+
    block("概念资金流向",flow.status,`<p class="mute">东财概念板块今日主力净流入，按净额排序的前 8 名。词典题材的匹配结果在上面的题材表，不参与「正式可做」。</p>`+miniTable(["概念","涨跌幅","主力净流入","净流入最大股"],top));
}
function navSvg(nav){
  const w=680,h=220,padL=48,padR=12,padT=16,padB=28;
  const keys=[["nav","模拟盘","#f0a36a"],["hs300_nav","沪深300","#a1a1a6"],["cyb_nav","创业板指","#8eb6ff"]];
  const vals=[];
  nav.forEach(p=>keys.forEach(k=>{if(p[k[0]]!=null)vals.push(+p[k[0]])}));
  if(!vals.length) return "<p>净值数据缺失</p>";
  let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max-min<1e-6){min-=0.005;max+=0.005}
  const n=nav.length;
  const X=i=>padL+(n<=1?(w-padL-padR)/2:i*(w-padL-padR)/(n-1));
  const Y=v=>padT+(max-v)/(max-min)*(h-padT-padB);
  const lines=keys.map(([k,label,color])=>{
    const pts=nav.map((p,i)=>p[k]==null?null:X(i).toFixed(1)+","+Y(+p[k]).toFixed(1)).filter(Boolean);
    return pts.length?`<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.join(" ")}"/>`:"";
  }).join("");
  const y0=Y(1),base=y0>=padT&&y0<=h-padB?`<line x1="${padL}" y1="${y0.toFixed(1)}" x2="${w-padR}" y2="${y0.toFixed(1)}" stroke="rgba(237,237,237,.18)"/>`:"";
  const legend=keys.map(([,label,color])=>`<span><i style="background:${color}"></i>${label}</span>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="模拟盘净值与沪深300、创业板指">${base}${lines}</svg><div class="legend">${legend}</div>`;
}
function renderPaper(p){
  const el=document.getElementById("paper");
  if(!p||p.status==="数据缺失"&&!(p.nav||[]).length){
    el.innerHTML=`<h2>模拟盘</h2><p>数据缺失。${esc((p&&p.note)||"没有编造净值。")}</p>`;
    return;
  }
  const m=p.metrics||{},nav=p.nav||[];
  const pos=p.positions||[],trades=(p.trades||[]).slice(-12).reverse(),pending=p.pending||[];
  const power=p.buying_power==null?p.cash:p.buying_power;
  const locked=Number(p.locked_shares||0);
  const gaps=(p.gaps||[]).filter(Boolean);
  const unsettled=Number(p.unsettled_proceeds||0);
  el.innerHTML=`<h2>模拟盘</h2>
<div class="chips">${chip("初始资金",yuan(p.initial_cash))}${chip("现金",yuan(p.cash))}${chip("可用购买力",yuan(power))}${chip("T+1锁定",locked?locked+"股":"0")}${chip("净值",p.equity==null?"数据缺失":yuan(p.equity))}${chip("累计收益",ratioPct(m.cum_return))}${chip("最大回撤",m.max_drawdown==null?"数据缺失":ratioPct(m.max_drawdown))}${chip("沪深300",ratioPct(m.hs300_return))}${chip("创业板指",ratioPct(m.cyb_return))}${chip("胜率",m.win_rate==null?"数据缺失":ratioPct(m.win_rate))}${chip("盈亏比",m.payoff==null?"数据缺失":Number(m.payoff).toFixed(2))}${chip("最大单笔亏损",m.max_loss==null?"数据缺失":yuan(m.max_loss))}${chip("已平仓",m.closed??0)}</div>
${navSvg(nav)}
<p class="mute">现金 ${yuan(p.cash)}，可用购买力 ${yuan(power)}，T+1 锁定 ${locked?locked+"股":"没有"}。${unsettled?`待交收 ${yuan(p.unsettled_proceeds)}，已交收 ${yuan(p.settled_cash)}。`:""}A股卖出款当日可再买，买入立即占用现金；交收不重复增加现金，不模拟融资。</p>
<p class="mute">${esc(p.note||"")} 佣金万 3 双边，滑点 0.1%，卖出印花税 0.05%。收盘计算信号，次日开盘价成交（T+1 open）。涨停买不进，跌停卖不出，不能成交就顺延。买入当日股份不可卖，下一上交所交易日才可卖。这是虚拟记账，不是下单。</p>
${gaps.length?`<p class="mute">缺口：${esc(gaps.join("；"))}</p>`:""}
<h2>当前持仓</h2>
${pos.length?`<div class="wrap"><table><thead><tr><th class="l">代码</th><th class="l">名称</th><th>股数</th><th>可卖</th><th>T+1锁定</th><th>收盘价</th><th>市值</th><th>浮盈亏</th><th>目标权重</th></tr></thead><tbody>${pos.map(r=>{
  const pnl=r.unrealized_pnl,lockN=Number(r.locked_shares||0);
  const pnlCls=pnl==null?"":(pnl>0?"p":pnl<0?"n":"");
  const lockTxt=lockN?(lockN+(r.sellable_date?" "+r.sellable_date+"起":"")):"0";
  return `<tr><td class="l">${esc(r.code)}</td><td class="l">${esc(r.name)}</td><td>${r.shares}</td><td>${r.sellable_shares==null?r.shares:r.sellable_shares}</td><td>${esc(lockTxt)}</td><td>${r.close==null?"数据缺失":r.close}</td><td>${yuan(r.market_value)}</td><td class="${pnlCls}">${pnl==null?"—":yuan(pnl)}</td><td>${r.target_weight||0}%</td></tr>`;
}).join("")}</tbody></table></div>`:`<p>空仓。正式四王留空时资金停在现金，不编造持仓。现金 ${yuan(p.cash)}，可用购买力 ${yuan(power)}，没有 T+1 锁定股份。</p>`}
<h2>待成交</h2>
${pending.length?`<div class="wrap"><table><thead><tr><th class="l">代码</th><th class="l">方向</th><th>目标权重</th><th class="l">说明</th></tr></thead><tbody>${pending.map(r=>`<tr><td class="l">${esc(r.code)} ${esc(r.name||"")}</td><td class="l">${esc(r.side)}</td><td>${r.target_weight||0}%</td><td class="wrap">${esc(r.note||"")}</td></tr>`).join("")}</tbody></table></div>`:"<p class='mute'>没有待到下一交易日开盘的单。</p>"}
<h2>最近交易</h2>
${trades.length?`<div class="wrap"><table class="min"><thead><tr><th class="l">日期</th><th class="l">代码</th><th class="l">方向</th><th>股数</th><th>开盘</th><th>成交价</th><th>金额</th><th>佣金</th><th>印花税</th><th class="l">说明</th></tr></thead><tbody>${trades.map(t=>`<tr><td class="l">${esc(t.date)}</td><td class="l">${esc(t.name||"")} ${esc(t.code)}</td><td class="l">${t.side==="buy"?"买":"卖"}</td><td>${t.shares}</td><td>${t.open}</td><td>${t.price}</td><td>${yuan(t.notional)}</td><td>${yuan(t.commission)}</td><td>${yuan(t.stamp)}</td><td class="wrap">${esc(t.note||"")}</td></tr>`).join("")}</tbody></table></div>`:"<p class='mute'>尚无成交。信号日收盘后才记账，成交在下一交易日开盘。</p>"}

  document.getElementById("meta").textContent=d.stale?"数据过期，没有可展示的行情":"数据不完整";

const C=d.config,S=d.sentiment,sm={进攻:"st-atk",观望:"st-wait",退潮:"st-ebb",暂停入选:"st-stop"}[S.status]||"";

<div class="chips">${chip("涨停",S.zt??"缺数据")}${chip("跌停",S.dt??"缺数据")}${chip("炸板",S.zb??"缺数据")}${chip("炸板率",S.zb_rate==null?"缺数据":S.zb_rate+"%")}${chip("连板高度",S.height??"缺数据")}${chip("昨日涨停今日收益",S.yzt_avg==null?"缺数据":(S.yzt_avg>0?"+":"")+S.yzt_avg+"%")}${chip("昨日跌停",S.dt_prev??"缺数据")}${chip("昨日高度",S.height_prev??"缺数据")}${chip("高度标断板",S.height_broken==null?"缺数据":S.height_broken?"是":"否")}</div>
<div class="mute">${S.why}</div>`;
const th=[["name","题材"],["n","涨停"],["height","最高板"],["day","第几天"],["catalyst","催化"],["echelon","梯队"],["capacity","容量"],["flow","概念资金"],["qualified","正式可做"]];

document.getElementById("rule").innerHTML=`<h2 style="color:var(--fg)">口径（研究，不下单）</h2>
<p><b>市场</b>：T+1。主板 10%，创业板和科创板 20%，ST 5%，北交所 30%。</p>
<p><b>模拟盘</b>：信号在信号日收盘后计算，下一交易日开盘价成交（T+1 open）。涨停买不进，跌停卖不出，不能成交就顺延。初始虚拟资金 100 万，只按正式四王的名单和权重调仓。佣金万 3 双边，滑点 0.1%，卖出印花税 0.05%。没有平仓时，胜率、盈亏比、最大单笔亏损保持数据缺失，不编造。模拟盘现已遵循 A 股 T+1：买入当日股份不可卖，自动调仓也一样，下一上交所交易日才可卖，不等满 24 小时。卖出款当日可再买。页面分开显示现金、可用购买力和 T+1 锁定股数。单笔止损的研究口径仍是买入价下方 ${C.stop_pct}%，模拟盘本身不代为触发止损；锁定期间错过的卖出，到可卖日按当时开盘价和涨跌停再决定。</p>
<p><b>策略标签</b>：放量上涨、停机坪、回踩年线、突破平台、无大幅回撤、均线多头，只作为候选池的辅助标签和可选初筛。正式四王的规则和阈值没有改。</p>
<p><b>可做题材要四条一起过</b>：有催化（脚本定不了就标待人工确认，写入 config.json 的 manual_catalyst 才算通过）；梯队为当日涨停至少 ${C.echelon_min} 只且有 ${C.lbc_min} 板以上；容量为板块成交额放大且有中军；处在启动或加速的第 2 到 4 天。第 5 天以上和一日游不做。天数要靠逐日题材档案积累，本轮还没有这份档案，天数一律缺数据。调仓记录在 data/history.json，不是题材天数。</p>
<p><b>归类</b>：用同花顺涨停原因，按「+」分段，跳过三季报、重组、国资这类标签，取第一个词典题材。带引号或写明字辈的，归入字面博弈，不算催化。词典在 config.json。原因对不上的涨停不进题材梯队（本页未归类 ${d.untagged} 只${(d.untagged_names||[]).length?"："+(d.untagged_names||[]).join("、"):""}）。</p>
<p><b>个股</b>：龙头、补涨、中军这个顺序。回避一字板、尾盘偷袭（首次封板 ≥14:30，东财与同花顺取更晚的一个）、纯字面蹭名、ST 和退市风险、流通市值 &lt; ${C.float_min_yi} 亿。正式池还要流通市值 ${C.float_min_yi}–${C.float_max_yi} 亿（中军放到 ${C.float_mid_max_yi} 亿）、近 20 日日均成交额 &gt; ${C.amount_avg_yi} 亿、没有减持/立案/业绩暴雷、不在交易所重点监控。后几项本轮大多是缺数据，所以表里是「未正式入池」。</p>
<p><b>买点</b>：只有盘后数据。正式入选后给次日观察买点（涨停价或关键支撑），高开超过 ${C.no_chase_gap}% 不追。本页四王为空，不编造买点和止损价。</p>
<p><b>情绪</b>：涨停、跌停、高度、炸板率、昨日涨停今日收益五项目齐才给进攻 / 观望 / 退潮。退潮看三件事：高度标断板、跌停数比前一交易日增加、昨日涨停今日平均收益为负，有一件即退潮。缺任何一项则暂停入选。进攻阈值（涨停≥${C.kings?60:60}、炸板率≤25%、昨日涨停收益≥1%）写在脚本里，待确认。</p>
<p><b>重点监控</b>：${d.monitor_ok?`东财在册且区间覆盖 ${d.data_date} 的有 ${d.monitor.length} 条`:"缺数据"}。已过期、从名单摘掉的历史监管，这份静态文件里可能没有。</p>
<p><b>已知缺口</b>：${d.failed.join("；")||"本次抓取没有失败项"}。开盘啦题材强度接口有响应但名单为空，本轮不用它。</p>`;

function histLeg(xs){return (!xs||!xs.length)?"无":xs.map(x=>`${x.name?x.name+" ":""}${x.code}${x.weight==null?"":" "+x.weight+"%"}`).join("、")}
fetch("data/history.json",{cache:"no-store"}).then(r=>r.json()).then(h=>{
  const ev=h.events||[];
  document.querySelector("#hist thead tr").innerHTML=["日期","调入","调出","调仓后权重","原因"].map(x=>`<th class="l wrap">${x}</th>`).join("");
  document.querySelector("#hist tbody").innerHTML=ev.length?ev.map(e=>`<tr><td class="l">${e.date}</td><td class="wrap">${histLeg(e.in)}</td><td class="wrap">${histLeg(e.out)}</td><td class="wrap">${histLeg(e.weights)}</td><td class="wrap">${(e.changes||[]).join("；")||e.reason||"—"}</td></tr>`).join(""):`<tr><td class="l" colspan="5">尚无调仓记录</td></tr>`;
  document.getElementById("histnote").textContent=h.note||"调入、调出、权重为「无」表示该日四王留空，不是漏记。";
}).catch(e=>{document.getElementById("histnote").textContent="调仓记录加载失败："+e});
